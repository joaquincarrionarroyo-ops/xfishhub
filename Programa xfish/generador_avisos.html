<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Avisos | X-Fish</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f0f4f8; }
        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.6); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05); }
        .blob { position: fixed; filter: blur(80px); z-index: -1; border-radius: 50%; animation: float 10s ease-in-out infinite; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-20px); } 100% { transform: translateY(0px); } }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.02); }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="relative min-h-screen text-slate-800 pb-12">

    <!-- Fondos -->
    <div class="blob bg-amber-200 w-[500px] h-[500px] top-[-100px] left-[-100px] opacity-40"></div>
    <div class="blob bg-orange-200 w-[400px] h-[400px] bottom-[100px] right-[-50px] opacity-50" style="animation-delay: -2s;"></div>

    <header class="glass-panel sticky top-0 z-50 px-6 py-4 mb-8">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <h1 class="text-xl font-extrabold text-slate-800 flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-amber-400 to-orange-500 shadow flex items-center justify-center">
                    <i class="fa fa-bullhorn text-white text-sm"></i>
                </div>
                Generador de Avisos Emergentes (Popups)
            </h1>
            <a href="index.html" class="text-sm font-semibold text-orange-600 hover:text-orange-800">← Volver al Hub</a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 md:px-6">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- CONTROLES -->
            <div class="lg:col-span-4 space-y-6">
                <div class="glass-panel rounded-2xl p-6">
                    <h2 class="text-lg font-bold text-slate-800 mb-4">Textos del Aviso</h2>
                    
                    <div class="space-y-4 text-sm">
                        
                        <div>
                            <label class="block font-bold text-slate-600 mb-1">Título Principal</label>
                            <input type="text" id="ctrl-titulo" value="Información Importante" class="w-full px-3 py-2 rounded-lg border border-slate-300 outline-none" oninput="actualizarModal()">
                        </div>

                        <div>
                            <label class="block font-bold text-slate-600 mb-1">Caja de Alerta (Amarilla)</label>
                            <textarea id="ctrl-alerta" rows="2" class="w-full px-3 py-2 rounded-lg border border-slate-300 outline-none" oninput="actualizarModal()">Este Lunes 28 de septiembre nuestras oficinas permanecerán cerradas.</textarea>
                        </div>

                        <hr class="border-slate-200">

                        <div>
                            <label class="block font-bold text-slate-600 mb-1">Teléfono de Contacto</label>
                            <input type="text" id="ctrl-tel" value="📞 3987-3673" class="w-full px-3 py-2 rounded-lg border border-slate-300 outline-none" oninput="actualizarModal()">
                        </div>

                        <div>
                            <label class="block font-bold text-slate-600 mb-1">Horario de Atención</label>
                            <input type="text" id="ctrl-horario" value="Lunes a Viernes de 9 a 16:30 hs" class="w-full px-3 py-2 rounded-lg border border-slate-300 outline-none" oninput="actualizarModal()">
                        </div>

                        <hr class="border-slate-200">

                        <div>
                            <label class="block font-bold text-slate-600 mb-1">Texto del Botón (Cerrar)</label>
                            <input type="text" id="ctrl-btn" value="Aceptar" class="w-full px-3 py-2 rounded-lg border border-slate-300 outline-none" oninput="actualizarModal()">
                        </div>
                        
                        <div>
                            <label class="block font-bold text-slate-600 mb-1">Color Principal (Botón e Ícono)</label>
                            <input type="color" id="ctrl-color" value="#0056b3" class="w-full h-10 rounded-lg cursor-pointer" oninput="actualizarModal()">
                        </div>

                    </div>
                </div>
            </div>

            <!-- VISTA PREVIA Y CÓDIGO -->
            <div class="lg:col-span-8 space-y-6">
                
                <div class="glass-panel rounded-2xl p-6">
                    <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center justify-between">
                        Vista Previa
                    </h2>
                    <!-- Vista Previa con fondo simulando tu web -->
                    <div class="relative w-full h-[500px] border border-slate-300 rounded-xl overflow-hidden bg-slate-100 flex items-center justify-center bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]">
                        <div id="preview-container" class="w-full h-full">
                            <!-- Inyección del modal visual -->
                        </div>
                    </div>
                </div>

                <div class="glass-panel rounded-2xl p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-bold text-slate-800">Código HTML para Odoo</h2>
                        <button onclick="copiarCodigo()" id="btn-copiar" class="bg-slate-800 hover:bg-slate-900 text-white font-bold py-2 px-6 rounded-lg text-sm transition shadow">
                            📋 Copiar Código
                        </button>
                    </div>
                    <textarea id="output-code" readonly class="w-full h-48 p-4 rounded-xl border border-slate-300 bg-slate-50 text-xs font-mono text-slate-600 outline-none resize-y"></textarea>
                    <p class="text-xs text-slate-500 mt-2">Pegá este código en un bloque "HTML personalizado" o usando el editor de código del maquetador de Odoo. Ya incluye la función para que el botón de cerrar funcione automáticamente.</p>
                </div>

            </div>
        </div>
    </main>

<script>
    function actualizarModal() {
        const titulo = document.getElementById('ctrl-titulo').value;
        const alerta = document.getElementById('ctrl-alerta').value;
        const tel = document.getElementById('ctrl-tel').value;
        const horario = document.getElementById('ctrl-horario').value;
        const btnText = document.getElementById('ctrl-btn').value;
        const color = document.getElementById('ctrl-color').value;

        // Construir HTML del Modal con los estilos exactos que pediste + función de cierre
        const htmlModal = `
<!-- INICIO POPUP AVISO IMPORTANTE -->
<div id="infoBannerModal" style="display: flex; position: fixed; top: 0px; left: 0px; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: 10500; align-items: center; justify-content: center; backdrop-filter: blur(3px);">
    <div style="background: white; padding: 2rem; border-radius: 12px; max-width: 90%; width: 450px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
        <div style="margin-bottom: 1rem;">
            <i class="fa fa-info-circle" style="font-size: 3rem; color: ${color};"></i>
        </div>
        <h3 style="margin-bottom: 1rem; color: #333; font-weight: bold; font-size: 1.5rem; margin-top: 0;">${titulo}</h3>
        
        <div style="color: #555; font-size: 1.1rem; line-height: 1.5; margin-bottom: 1.5rem;">
            <div style="background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; border-radius: 8px; padding: 12px; margin-bottom: 1.5rem; font-size: 0.95rem; line-height: 1.4; text-align: left;">
                ⚠️ <strong>Aviso:</strong> ${alerta}
            </div>
            Para realizar consultas, por favor comunicate al:
            <br>
            <strong style="font-size: 1.5rem; color: #212529; display: block; margin-top: 10px;">${tel}</strong>
            <span style="display: block; font-size: 0.95rem; color: #6c757d; margin-top: 6px;">
                Horario de atención: <strong>${horario}</strong>
            </span>
        </div>
        <button id="acceptInfoBanner" style="width: 100%; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 1.1rem; border: none; cursor: pointer; background-color: ${color}; color: white; transition: opacity 0.2s;">
            ${btnText}
        </button>
    </div>
</div>

<script>
    // Pequeño script para cerrar el modal al hacer clic en aceptar
    document.addEventListener("DOMContentLoaded", function() {
        var btnAceptar = document.getElementById("acceptInfoBanner");
        var modal = document.getElementById("infoBannerModal");
        if(btnAceptar && modal) {
            btnAceptar.addEventListener("click", function() {
                modal.style.display = "none";
            });
        }
    });
<\/script>
<!-- FIN POPUP AVISO IMPORTANTE -->
`.trim();

        // Para la vista previa usamos display:flex forzado
        let htmlPreview = htmlModal.replace('<!-- INICIO POPUP AVISO IMPORTANTE -->', '')
                                   .replace('<!-- FIN POPUP AVISO IMPORTANTE -->', '')
                                   .replace('<script>', '<!-- ') // Comentamos el script para que no se ejecute en la preview
                                   .replace('<\/script>', ' -->');
        
        // Hacemos que en la preview se posicione absoluto para no romper nuestra app
        htmlPreview = htmlPreview.replace('position: fixed;', 'position: absolute;');

        document.getElementById('preview-container').innerHTML = htmlPreview;
        document.getElementById('output-code').value = htmlModal;
    }

    function copiarCodigo() {
        const codigo = document.getElementById('output-code');
        codigo.select();
        codigo.setSelectionRange(0, 99999);
        navigator.clipboard.writeText(codigo.value);
        
        const btn = document.getElementById('btn-copiar');
        const textoOriginal = btn.innerHTML;
        btn.innerHTML = "✅ ¡Copiado!";
        btn.classList.replace('bg-slate-800', 'bg-emerald-600');
        
        setTimeout(() => {
            btn.innerHTML = textoOriginal;
            btn.classList.replace('bg-emerald-600', 'bg-slate-800');
        }, 2000);
    }

    document.addEventListener('DOMContentLoaded', actualizarModal);
</script>

</body>
</html>
