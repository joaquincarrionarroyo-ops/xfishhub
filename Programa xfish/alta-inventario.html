<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alta y Conciliación de Inventario | X-Fish</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; background-color: #f0f4f8; }
        .glass-panel { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.9); box-shadow: 0 8px 32px 0 rgba(14, 56, 114, 0.05); }
        .blob { position: fixed; filter: blur(90px); z-index: -1; border-radius: 50%; animation: float 10s ease-in-out infinite; }
        @keyframes float { 0% { transform: translateY(0px) scale(1); } 50% { transform: translateY(-20px) scale(1.05); } 100% { transform: translateY(0px) scale(1); } }
        .custom-select, .custom-input { width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; background-color: rgba(255, 255, 255, 0.8); outline: none; transition: all 0.2s; font-weight: 600; color: #334155; }
        .custom-select:focus, .custom-input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.2); background-color: #fff; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.02); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="relative min-h-screen text-slate-800 selection:bg-indigo-500 selection:text-white pb-10">

    <div class="blob bg-indigo-300 w-[500px] h-[500px] top-[-100px] left-[-100px] opacity-40"></div>
    <div class="blob bg-blue-200 w-[400px] h-[400px] bottom-[100px] right-[-50px] opacity-50" style="animation-delay: -2s;"></div>
    <div class="blob bg-violet-200 w-[300px] h-[300px] top-[40%] left-[50%] opacity-40" style="animation-delay: -4s;"></div>

    <header class="glass-panel sticky top-0 z-50 px-8 py-4 mb-8">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-blue-600 shadow-lg shadow-indigo-500/30 flex items-center justify-center">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                </div>
                Alta y Cruce de Inventario
            </h1>
            <a href="index.html" class="text-sm font-semibold text-indigo-600 hover:text-indigo-800 transition-colors">← Volver al Hub</a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto w-full px-6 space-y-6 relative z-10">
        
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- EXCEL 1: INVENTARIO VIEJO -->
            <div class="glass-panel rounded-3xl p-6 border-t-4 border-t-slate-400">
                <h2 class="text-lg font-bold text-slate-700 mb-4 border-b border-slate-200/60 pb-2">1. Excel Base (Inventario Anterior)</h2>
                <input type="file" id="file-excel-viejo" accept=".xlsx, .xls, .csv" class="block w-full text-sm text-slate-600 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-bold file:bg-slate-100 file:text-slate-700 hover:file:bg-slate-200 cursor-pointer transition-colors mb-5"/>
                
                <div id="map-viejo" class="hidden grid grid-cols-1 md:grid-cols-2 gap-4 bg-white/60 p-4 rounded-xl border border-slate-200">
                    <div><label class="text-xs font-semibold text-slate-600 mb-1 block">Código *</label><select id="v-cod" class="custom-select border-slate-300"></select></div>
                    <div><label class="text-xs font-semibold text-slate-600 mb-1 block">Nombre del Producto</label><select id="v-nom" class="custom-select border-slate-300"></select></div>
                    <div><label class="text-xs font-semibold text-slate-600 mb-1 block">Precio Viejo</label><select id="v-pre" class="custom-select border-slate-300"></select></div>
                    <div><label class="text-xs font-semibold text-slate-600 mb-1 block">Cantidad Anterior</label><select id="v-can" class="custom-select border-slate-300"></select></div>
                </div>
            </div>

            <!-- EXCEL 2: ALTA NUEVA -->
            <div class="glass-panel rounded-3xl p-6 border-t-4 border-t-indigo-500">
                <h2 class="text-lg font-bold text-indigo-800 mb-4 border-b border-indigo-100 pb-2">2. Excel Alta (Mercadería Nueva)</h2>
                <input type="file" id="file-excel-nuevo" accept=".xlsx, .xls, .csv" class="block w-full text-sm text-slate-600 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-bold file:bg-indigo-100 file:text-indigo-700 hover:file:bg-indigo-200 cursor-pointer transition-colors mb-5"/>
                
                <div id="map-nuevo" class="hidden grid grid-cols-1 md:grid-cols-2 gap-4 bg-indigo-50/50 p-4 rounded-xl border border-indigo-100">
                    <div><label class="text-xs font-semibold text-indigo-700 mb-1 block">Código *</label><select id="n-cod" class="custom-select border-indigo-200"></select></div>
                    <div><label class="text-xs font-semibold text-indigo-700 mb-1 block">Precio Nuevo</label><select id="n-pre" class="custom-select border-indigo-200"></select></div>
                    <div><label class="text-xs font-semibold text-indigo-700 mb-1 block">Unidades por Bulto</label><select id="n-uni" class="custom-select border-indigo-200"></select></div>
                    <div><label class="text-xs font-semibold text-indigo-700 mb-1 block">Cantidad de Bultos</label><select id="n-bul" class="custom-select border-indigo-200"></select></div>
                    <div class="md:col-span-2"><label class="text-xs font-semibold text-indigo-700 mb-1 block">Cantidad Total Alta (Opcional - Si está vacía se multiplica auto)</label><select id="n-tot" class="custom-select border-indigo-200"></select></div>
                </div>
            </div>
        </div>

        <div class="flex justify-center mt-6">
            <button id="btn-process" class="bg-gradient-to-r from-indigo-500 to-blue-600 hover:from-indigo-600 hover:to-blue-700 text-white font-bold py-3 px-10 rounded-xl shadow-lg shadow-indigo-500/30 transform transition-all duration-200 hover:-translate-y-0.5 text-sm uppercase tracking-wide disabled:opacity-50">
                🔄 Cruzar Datos y Generar Excel
            </button>
        </div>

        <!-- RESULTADOS -->
        <div id="results-section" class="hidden space-y-6 mt-8">
            <div class="glass-panel p-5 rounded-2xl flex flex-col md:flex-row items-center justify-between border-l-4 border-l-emerald-500">
                <div>
                    <h3 class="text-lg font-bold text-slate-800">Cruce Finalizado Exitosamente</h3>
                    <p class="text-sm text-slate-500 font-medium mt-1" id="results-count">Se vincularon X productos.</p>
                </div>
                <button id="btn-dl-excel" class="mt-4 md:mt-0 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold py-2.5 px-6 rounded-xl shadow-lg shadow-emerald-500/30 flex items-center gap-2 transition-transform hover:-translate-y-0.5">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    Descargar Excel Combinado
                </button>
            </div>

            <!-- TABLA PREVIEW -->
            <div class="glass-panel rounded-3xl p-6 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm text-slate-600">
                        <thead class="text-xs text-slate-700 uppercase bg-slate-100/50">
                            <tr>
                                <th class="px-3 py-3 rounded-tl-lg">Código</th>
                                <th class="px-3 py-3">Nombre</th>
                                <th class="px-3 py-3 text-right border-l border-slate-200">Pre. Viejo</th>
                                <th class="px-3 py-3 text-right text-emerald-700 bg-emerald-50/50">Pre. Nuevo</th>
                                <th class="px-3 py-3 text-right border-l border-slate-200">Stock Anterior</th>
                                <th class="px-3 py-3 text-right bg-indigo-50/50">Unid/Bulto</th>
                                <th class="px-3 py-3 text-right bg-indigo-50/50">Bultos</th>
                                <th class="px-3 py-3 text-right font-bold text-indigo-700 bg-indigo-100/50">Total Alta</th>
                                <th class="px-3 py-3 text-right rounded-tr-lg">Diferencia Stock</th>
                            </tr>
                        </thead>
                        <tbody id="table-body" class="divide-y divide-slate-100">
                            <!-- Filas inyectadas por JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        let dataViejo = [];
        let headersViejo = [];
        let dataNuevo = [];
        let headersNuevo = [];
        let finalMergedData = [];

        function handleExcelUpload(fileInputId, mapContainerId, selectIds, dataArrayRef, headerArrayRef) {
            document.getElementById(fileInputId).addEventListener('change', (e) => {
                if(e.target.files.length) {
                    const reader = new FileReader();
                    reader.onload = function(evt) {
                        const data = new Uint8Array(evt.target.result);
                        const workbook = XLSX.read(data, {type: 'array'});
                        const sheet = workbook.Sheets[workbook.SheetNames[0]];
                        
                        const jsonData = XLSX.utils.sheet_to_json(sheet, {defval: ""});
                        const headers = XLSX.utils.sheet_to_json(sheet, {header: 1})[0] || [];
                        
                        if(fileInputId === 'file-excel-viejo') { dataViejo = jsonData; headersViejo = headers; }
                        else { dataNuevo = jsonData; headersNuevo = headers; }

                        selectIds.forEach(id => {
                            const select = document.getElementById(id);
                            const isOptional = (id !== 'v-cod' && id !== 'n-cod');
                            select.innerHTML = isOptional ? "<option value=''>-- No disponible / Vacío --</option>" : "<option value=''>Seleccionar columna...</option>";
                            
                            headers.forEach(opt => {
                                if(opt && String(opt).trim() !== "") select.innerHTML += `<option value='${opt}'>${opt}</option>`;
                            });
                        });
                        
                        document.getElementById(mapContainerId).classList.remove('hidden');
                    };
                    reader.readAsArrayBuffer(e.target.files[0]);
                }
            });
        }

        handleExcelUpload('file-excel-viejo', 'map-viejo', ['v-cod', 'v-nom', 'v-pre', 'v-can']);
        handleExcelUpload('file-excel-nuevo', 'map-nuevo', ['n-cod', 'n-pre', 'n-uni', 'n-bul', 'n-tot']);

        function parseNum(val) {
            if(val === undefined || val === null || val === "") return 0;
            if(typeof val === 'number') return val;
            let str = String(val).replace(/[^0-9.,-]/g, '').replace(',', '.');
            let num = parseFloat(str);
            return isNaN(num) ? 0 : num;
        }

        document.getElementById('btn-process').addEventListener('click', () => {
            const vCod = document.getElementById('v-cod').value;
            const nCod = document.getElementById('n-cod').value;

            if (!vCod || !nCod) {
                alert("Es obligatorio seleccionar la columna de CÓDIGO en ambos Excels para poder cruzarlos.");
                return;
            }

            const vNom = document.getElementById('v-nom').value;
            const vPre = document.getElementById('v-pre').value;
            const vCan = document.getElementById('v-can').value;

            const dictViejo = {};
            dataViejo.forEach(row => {
                let cod = String(row[vCod]||"").trim().toUpperCase();
                if(cod) dictViejo[cod] = row;
            });

            const nPre = document.getElementById('n-pre').value;
            const nUni = document.getElementById('n-uni').value;
            const nBul = document.getElementById('n-bul').value;
            const nTot = document.getElementById('n-tot').value;

            finalMergedData = [];
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            let count = 0;

            dataNuevo.forEach(rowNuevo => {
                let cod = String(rowNuevo[nCod]||"").trim().toUpperCase();
                if(!cod) return; 

                let rowViejo = dictViejo[cod] || {}; 

                let uni = parseNum(rowNuevo[nUni]);
                let bul = parseNum(rowNuevo[nBul]);
                let totalAlta = nTot && rowNuevo[nTot] !== "" ? parseNum(rowNuevo[nTot]) : (uni * bul);

                let preNuevo = parseNum(rowNuevo[nPre]);
                let preViejo = parseNum(rowViejo[vPre]);
                let stockViejo = parseNum(rowViejo[vCan]);
                let nombre = rowViejo[vNom] ? rowViejo[vNom] : (rowNuevo['Nombre'] || rowNuevo['Descripción'] || "S/N");

                // Cálculo de la diferencia
                let diferenciaStock = totalAlta - stockViejo;
                
                // Formateo visual para la tabla
                let difClass = "text-slate-600";
                let difSign = "";
                if (diferenciaStock > 0) { difClass = "text-emerald-600 font-bold bg-emerald-50/50"; difSign = "+"; }
                else if (diferenciaStock < 0) { difClass = "text-red-500 font-bold bg-red-50/50"; }

                const mergedRow = {
                    "Código": cod,
                    "Nombre": nombre,
                    "Unidades por bulto": uni,
                    "Cantidad de bultos": bul,
                    "Cantidad total (Alta)": totalAlta,
                    "Precio viejo": preViejo,
                    "Precio nuevo": preNuevo,
                    "Stock anterior": stockViejo,
                    "Diferencia de Stock": diferenciaStock
                };

                finalMergedData.push(mergedRow);

                if (count < 50) {
                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-50 transition-colors">
                            <td class="px-3 py-2 font-mono text-[11px] font-bold text-slate-800">${cod}</td>
                            <td class="px-3 py-2 text-[11px] truncate max-w-[150px]" title="${nombre}">${nombre}</td>
                            <td class="px-3 py-2 text-right text-xs border-l border-slate-200">$${preViejo.toLocaleString('es-AR')}</td>
                            <td class="px-3 py-2 text-right text-xs font-bold text-emerald-700 bg-emerald-50/30">$${preNuevo.toLocaleString('es-AR')}</td>
                            <td class="px-3 py-2 text-right text-xs border-l border-slate-200">${stockViejo}</td>
                            <td class="px-3 py-2 text-right text-xs bg-indigo-50/20">${uni}</td>
                            <td class="px-3 py-2 text-right text-xs bg-indigo-50/20">${bul}</td>
                            <td class="px-3 py-2 text-right text-xs font-bold text-indigo-700 bg-indigo-50/60">${totalAlta}</td>
                            <td class="px-3 py-2 text-right text-xs ${difClass}">${difSign}${diferenciaStock}</td>
                        </tr>
                    `;
                }
                count++;
            });

            if(count > 50) {
                tbody.innerHTML += `<tr><td colspan="9" class="text-center py-3 text-xs font-bold text-slate-400 bg-slate-50">... y ${count - 50} filas más ocultas (se descargarán en el Excel)</td></tr>`;
            }

            document.getElementById('results-count').textContent = `Se procesaron y combinaron ${count} productos del Alta Nueva.`;
            document.getElementById('results-section').classList.remove('hidden');
        });

        document.getElementById('btn-dl-excel').addEventListener('click', () => {
            if(finalMergedData.length === 0) return;

            const worksheet = XLSX.utils.json_to_sheet(finalMergedData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Alta Combinada");
            
            XLSX.writeFile(workbook, "XFish_Cruce_Alta_Inventario.xlsx");
        });
    </script>
</body>
</html>
