<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM IA | X-Fish</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f0f4f8; }
        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.6); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05); }
        .blob { position: fixed; filter: blur(80px); z-index: -1; border-radius: 50%; animation: float 10s ease-in-out infinite; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-20px); } 100% { transform: translateY(0px); } }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.02); }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        .toggle-checkbox:checked { right: 0; border-color: #8b5cf6; }
        .toggle-checkbox:checked + .toggle-label { background-color: #8b5cf6; }
        .toggle-checkbox { right: 4px; z-index: 1; border-color: #e2e8f0; transition: all 0.3s; }
        .toggle-label { background-color: #cbd5e1; transition: all 0.3s; }
    </style>
</head>
<body class="relative min-h-screen text-slate-800 pb-12">

    <div class="blob bg-violet-200 w-[500px] h-[500px] top-[-100px] left-[-100px] opacity-40"></div>
    <div class="blob bg-fuchsia-200 w-[400px] h-[400px] bottom-[100px] right-[-50px] opacity-50" style="animation-delay: -2s;"></div>

    <header class="glass-panel sticky top-0 z-50 px-6 py-4 mb-8">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <h1 class="text-xl font-extrabold text-slate-800 flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-violet-500 to-fuchsia-600 shadow flex items-center justify-center">
                    <i class="fa-solid fa-envelope-open-text text-white text-sm"></i>
                </div>
                CRM: Gestión Inteligente de Correos
            </h1>
            <a href="index.html" class="text-sm font-semibold text-violet-600 hover:text-violet-800">← Volver al Hub</a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 md:px-6">
        
        <div class="flex flex-col md:flex-row gap-4 mb-6">
            <div class="glass-panel rounded-xl p-4 flex-grow flex items-center gap-4">
                <div id="status-odoo-icon" class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-400"><i class="fa-solid fa-database"></i></div>
                <div>
                    <h3 class="font-bold text-sm text-slate-800">Sincronización Odoo</h3>
                    <p id="status-odoo-text" class="text-xs text-slate-500">Conectando catálogo y CRM...</p>
                </div>
            </div>
            <div class="glass-panel rounded-xl p-4 flex-grow flex items-center gap-4 border-l-4 border-violet-500">
                <div class="w-10 h-10 rounded-full bg-violet-50 flex items-center justify-center text-violet-500"><i class="fa-solid fa-brain"></i></div>
                <div class="flex-grow">
                    <h3 class="font-bold text-sm text-slate-800">Motor de Inteligencia Artificial</h3>
                    <p class="text-[10px] text-slate-500 mb-1">Clave de Google Gemini AI.</p>
                    <input type="password" id="api-key-ai" placeholder="Pegá tu API Key de Gemini aquí..." class="w-full px-2 py-1 rounded border border-slate-300 text-xs outline-none focus:border-violet-500" onchange="guardarApiKeyIA()">
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 h-[700px]">
            
            <!-- PANEL IZQUIERDO: BANDEJA DE ENTRADA CRM -->
            <div class="lg:col-span-4 h-full">
                <div class="glass-panel rounded-2xl h-full flex flex-col overflow-hidden">
                    <div class="p-4 border-b border-slate-200 bg-white/50 flex justify-between items-center">
                        <h2 class="font-bold text-slate-800 flex items-center gap-2"><i class="fa-solid fa-inbox text-violet-500"></i> Oportunidades Abiertas</h2>
                        <button onclick="cargarCRMLeads()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-2 py-1 rounded shadow-sm"><i class="fa-solid fa-sync-alt"></i> Actualizar</button>
                    </div>
                    
                    <div id="lista-leads" class="flex-grow overflow-y-auto p-2 space-y-2">
                        <p class="text-xs text-center text-slate-400 mt-10">Cargando correos desde Odoo...</p>
                    </div>
                </div>
            </div>

            <!-- PANEL CENTRAL/DERECHO: LECTURA Y RESPUESTA IA -->
            <div class="lg:col-span-8 h-full flex flex-col gap-6">
                
                <!-- Lectura del Lead Seleccionado -->
                <div class="glass-panel rounded-2xl p-5 flex flex-col bg-white">
                    <input type="hidden" id="lead-activo-id">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <h3 id="lead-nombre" class="font-bold text-lg text-slate-800">Seleccioná un correo de la lista</h3>
                            <p id="lead-mail" class="text-xs text-slate-500 font-mono">-</p>
                        </div>
                        <span id="lead-fecha" class="text-[10px] bg-slate-100 text-slate-500 px-2 py-1 rounded">-</span>
                    </div>
                    <textarea id="texto-cliente" readonly placeholder="El mensaje del cliente aparecerá aquí..." class="w-full h-24 p-3 rounded-lg border border-slate-200 bg-slate-50 text-sm text-slate-700 outline-none resize-none"></textarea>
                    
                    <div class="flex justify-between items-center mt-3 pt-3 border-t border-slate-100">
                        <div class="flex gap-4">
                            <select id="tono-respuesta" class="text-xs border border-slate-300 rounded-lg px-2 py-1 outline-none bg-white">
                                <option value="amable, comercial y persuasivo.">Tono Comercial</option>
                                <option value="profesional, corporativo y formal.">Tono Formal</option>
                            </select>
                            
                            <div class="flex items-center gap-2">
                                <div class="relative inline-block w-8 mr-1 align-middle select-none">
                                    <input type="checkbox" id="toggle-precios" class="toggle-checkbox absolute block w-4 h-4 rounded-full bg-white border-4 appearance-none cursor-pointer"/>
                                    <label for="toggle-precios" class="toggle-label block overflow-hidden h-4 rounded-full cursor-pointer"></label>
                                </div>
                                <label class="text-[10px] font-bold text-slate-600" for="toggle-precios">Incluir Precios</label>
                            </div>
                        </div>

                        <button onclick="generarRespuesta()" id="btn-generar" class="bg-violet-600 hover:bg-violet-700 text-white font-bold py-1.5 px-4 rounded-lg shadow-md transition text-xs flex items-center gap-2 disabled:opacity-50">
                            <i class="fa-solid fa-wand-magic-sparkles"></i> Redactar Respuesta
                        </button>
                    </div>
                </div>

                <!-- Respuesta Generada y Envío -->
                <div class="glass-panel rounded-2xl p-5 flex flex-col flex-grow relative">
                    
                    <div id="loading-overlay" class="absolute inset-0 bg-white/90 backdrop-blur-sm z-10 hidden flex-col items-center justify-center rounded-2xl">
                        <div class="w-10 h-10 border-4 border-violet-200 border-t-violet-600 rounded-full animate-spin mb-3"></div>
                        <p id="loading-text" class="text-xs font-bold text-violet-700 animate-pulse">Analizando...</p>
                    </div>

                    <div class="flex justify-between items-center mb-3">
                        <h2 class="text-sm font-bold text-slate-800"><i class="fa-solid fa-pen-nib text-fuchsia-500 mr-2"></i>Borrador de la IA</h2>
                    </div>
                    
                    <textarea id="texto-respuesta" placeholder="La respuesta lista para enviar a Odoo aparecerá aquí..." class="w-full flex-grow p-4 rounded-xl border border-slate-200 bg-white text-sm text-slate-700 outline-none resize-none mb-4 shadow-inner"></textarea>

                    <button onclick="enviarAOdoo()" id="btn-enviar" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl transition shadow-lg flex justify-center items-center gap-2 text-sm disabled:opacity-50">
                        <i class="fa-solid fa-paper-plane"></i> Enviar Correo y Registrar en Odoo CRM
                    </button>
                </div>
            </div>

        </div>
    </main>

<script>
    let catalogoOdoo = [];
    let leadsOdoo = [];
    const urlBackend = 'https://xfish-odoo-api.onrender.com';

    document.addEventListener('DOMContentLoaded', () => {
        const savedKey = sessionStorage.getItem('gemini_api_key');
        if (savedKey) document.getElementById('api-key-ai').value = savedKey;
        
        cargarCatalogoOdoo();
        cargarCRMLeads();
    });

    function guardarApiKeyIA() {
        sessionStorage.setItem('gemini_api_key', document.getElementById('api-key-ai').value.trim());
    }

    async function cargarCatalogoOdoo() {
        const icon = document.getElementById('status-odoo-icon');
        const text = document.getElementById('status-odoo-text');
        try {
            const pwd = sessionStorage.getItem('odoo_pwd');
            if (!pwd) { text.innerHTML = `<span class="text-rose-500">Iniciá sesión en Odoo</span>`; return; }
            
            const res = await fetch(`${urlBackend}/api/productos`, { headers: { 'x-odoo-password': pwd } });
            if (!res.ok) throw new Error("Fallo API");
            
            const data = await res.json();
            catalogoOdoo = data.filter(p => p.total > 0).map(p => ({
                sku: p.sku || '', nombre: p.nombre, precio: p.precio, stock: p.total, categoria: p.categ_id ? p.categ_id[1] : ''
            }));
            
            icon.classList.replace('bg-slate-100', 'bg-emerald-100');
            icon.classList.replace('text-slate-400', 'text-emerald-500');
            icon.innerHTML = '<i class="fa-solid fa-check"></i>';
            text.innerHTML = `<span class="text-emerald-600 font-bold">Catálogo sincronizado.</span>`;
        } catch (e) {
            icon.classList.replace('bg-slate-100', 'bg-rose-100');
            icon.classList.replace('text-slate-400', 'text-rose-500');
            icon.innerHTML = '<i class="fa-solid fa-times"></i>';
            text.innerHTML = `<span class="text-rose-500 font-bold">Fallo conexión Odoo.</span>`;
        }
    }

    async function cargarCRMLeads() {
        const contenedor = document.getElementById('lista-leads');
        contenedor.innerHTML = `<p class="text-xs text-center text-slate-400 mt-10"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Actualizando bandeja...</p>`;
        
        try {
            const pwd = sessionStorage.getItem('odoo_pwd');
            const res = await fetch(`${urlBackend}/api/crm-leads`, { headers: { 'x-odoo-password': pwd } });
            if (!res.ok) throw new Error("Fallo API Leads");
            
            leadsOdoo = await res.json();
            
            if (leadsOdoo.length === 0) {
                contenedor.innerHTML = `<p class="text-xs text-center text-slate-500 font-bold mt-10">No hay oportunidades abiertas.</p>`;
                return;
            }

            contenedor.innerHTML = leadsOdoo.map(lead => `
                <div onclick="seleccionarLead(${lead.id})" class="p-3 border border-slate-200 bg-white rounded-xl cursor-pointer hover:bg-violet-50 hover:border-violet-300 transition shadow-sm group">
                    <h4 class="font-bold text-sm text-slate-800 group-hover:text-violet-700 truncate">${lead.name}</h4>
                    <p class="text-[10px] text-slate-500 truncate mb-1"><i class="fa-regular fa-envelope mr-1"></i>${lead.email_from || 'Sin correo'}</p>
                    <p class="text-xs text-slate-600 line-clamp-2 leading-tight">${(lead.description || 'Sin mensaje').replace(/<[^>]*>?/gm, '')}</p>
                </div>
            `).join('');

        } catch (e) {
            contenedor.innerHTML = `<p class="text-xs text-center text-rose-500 font-bold mt-10">Error cargando correos.</p>`;
        }
    }

    function seleccionarLead(id) {
        const lead = leadsOdoo.find(l => l.id === id);
        if (!lead) return;

        document.getElementById('lead-activo-id').value = lead.id;
        document.getElementById('lead-nombre').textContent = lead.name;
        document.getElementById('lead-mail').textContent = lead.email_from || 'Sin correo registrado';
        document.getElementById('lead-fecha').textContent = lead.create_date.split(' ')[0];
        
        // Limpiar HTML basura de Odoo en la descripción
        const cleanText = (lead.description || '').replace(/<br\s*[\/]?>/gi, '\n').replace(/<[^>]*>?/gm, '');
        document.getElementById('texto-cliente').value = cleanText || 'El cliente no dejó un mensaje escrito.';
        document.getElementById('texto-respuesta').value = "";
    }

    function extraerPalabrasClave(texto) {
        const ignorar = ['hola', 'buenas', 'tardes', 'dias', 'noches', 'queria', 'saber', 'si', 'tienen', 'busco', 'necesito', 'precio', 'cuanto', 'cuesta', 'sale', 'gracias'];
        return texto.toLowerCase().replace(/[^\w\sáéíóúüñ]/g, '').split(/\s+/).filter(p => p.length > 3 && !ignorar.includes(p));
    }

    function buscarEnCatalogo(palabrasClave) {
        if(palabrasClave.length === 0) return [];
        let coincidencias = catalogoOdoo.map(prod => {
            let score = 0;
            const textoProd = `${prod.nombre} ${prod.categoria} ${prod.sku}`.toLowerCase();
            palabrasClave.forEach(keyword => { if (textoProd.includes(keyword)) score++; });
            return { producto: prod, score: score };
        });
        return coincidencias.filter(c => c.score > 0).sort((a, b) => b.score - a.score).slice(0, 8).map(c => c.producto);
    }

    async function generarRespuesta() {
        const apiKey = document.getElementById('api-key-ai').value.trim();
        const textoCliente = document.getElementById('texto-cliente').value.trim();
        const tono = document.getElementById('tono-respuesta').value;
        const incluirPrecios = document.getElementById('toggle-precios').checked;
        const btn = document.getElementById('btn-generar');
        const overlay = document.getElementById('loading-overlay');
        const loadingText = document.getElementById('loading-text');

        if (!apiKey) return alert("Por favor, configurá la API Key de Gemini.");
        if (!textoCliente) return alert("Seleccioná un correo de la lista primero.");

        btn.disabled = true;
        overlay.classList.remove('hidden');

        try {
            loadingText.textContent = "Analizando stock...";
            await new Promise(r => setTimeout(r, 500)); 
            
            const keywords = extraerPalabrasClave(textoCliente);
            const productosRelevantes = buscarEnCatalogo(keywords);

            let stringContextoStock = "No se encontraron productos exactos. Invitá a visitar la tienda online.";
            if (productosRelevantes.length > 0) {
                stringContextoStock = "Artículos en stock relacionados (USÁ ESTA INFORMACIÓN):\n";
                productosRelevantes.forEach(p => {
                    const infoPrecio = incluirPrecios ? `| Precio lista: $${p.precio.toLocaleString('es-AR')}` : '';
                    stringContextoStock += `- ${p.nombre} (SKU: ${p.sku}) | Stock: ${p.stock} unid. ${infoPrecio}\n`;
                });
            }

            loadingText.textContent = "Redactando correo...";
            
            const prompt = `
Eres el encargado de ventas de "X-Fish" (pesca y camping en Argentina).
Reglas:
1. Responde en español de Argentina (usando 'vos'). Tono: ${tono}
2. ${incluirPrecios ? 'INCLUYE LOS PRECIOS exactos.' : 'NO MENCIONES PRECIOS BAJO NINGÚN CONCEPTO, redirige a la web.'}
3. Usa esta info de stock real extraída del sistema (no inventes nada más):
${stringContextoStock}

Escribe SOLO el texto del email listo para enviar al cliente.

Mensaje del cliente:
"${textoCliente}"
            `;

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { temperature: 0.7, maxOutputTokens: 800 } })
            });

            if (!response.ok) throw new Error("Error en la IA.");

            const data = await response.json();
            document.getElementById('texto-respuesta').value = data.candidates[0].content.parts[0].text.trim();

        } catch (error) {
            alert(error.message);
        } finally {
            btn.disabled = false;
            overlay.classList.add('hidden');
        }
    }

    async function enviarAOdoo() {
        const leadId = document.getElementById('lead-activo-id').value;
        const mensaje = document.getElementById('texto-respuesta').value.trim();
        const btn = document.getElementById('btn-enviar');

        if (!leadId) return alert("Seleccioná un correo de la lista primero.");
        if (!mensaje) return alert("Generá o escribí la respuesta antes de enviar.");

        btn.disabled = true;
        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Enviando y registrando en Odoo...`;

        try {
            const pwd = sessionStorage.getItem('odoo_pwd');
            // Convertimos saltos de línea a etiquetas HTML para que Odoo lo renderice bien en el correo
            const mensajeHTML = mensaje.replace(/\n/g, '<br>');

            const res = await fetch(`${urlBackend}/api/crm-responder`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-odoo-password': pwd },
                body: JSON.stringify({ lead_id: leadId, mensaje: mensajeHTML })
            });

            if (!res.ok) throw new Error("Error de conexión");

            btn.classList.replace('bg-emerald-600', 'bg-slate-800');
            btn.innerHTML = `<i class="fa-solid fa-check"></i> ¡Enviado con éxito!`;
            
            setTimeout(() => {
                btn.classList.replace('bg-slate-800', 'bg-emerald-600');
                btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> Enviar Correo y Registrar en Odoo CRM`;
                btn.disabled = false;
                document.getElementById('texto-respuesta').value = ""; // Limpiar tras el envío
            }, 3000);

        } catch (e) {
            alert("Hubo un error al intentar despachar la respuesta en Odoo.");
            btn.disabled = false;
            btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> Reintentar Envío`;
        }
    }
</script>

</body>
</html>
