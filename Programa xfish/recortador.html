<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudio de Recorte e IA | X-Fish</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- Librería de Inteligencia Artificial para sacar fondos -->
    <script src="https://unpkg.com/@imgly/background-removal@1.4.3/dist/browser/imglyRemoveBackground.umd.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; background-color: #f0f4f8; }
        .glass-panel { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.9); box-shadow: 0 8px 32px 0 rgba(14, 56, 114, 0.05); }
        .blob { position: fixed; filter: blur(90px); z-index: -1; border-radius: 50%; animation: float 10s ease-in-out infinite; }
        @keyframes float { 0% { transform: translateY(0px) scale(1); } 50% { transform: translateY(-20px) scale(1.05); } 100% { transform: translateY(0px) scale(1); } }
        .custom-select, .custom-input { width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; background-color: rgba(255, 255, 255, 0.8); outline: none; transition: all 0.2s; font-weight: 600; color: #334155; }
        .custom-select:focus, .custom-input:focus { border-color: #10b981; box-shadow: 0 0 0 3px rgba(16,185,129,0.2); background-color: #fff; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.02); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        input[type=range] { width: 100%; accent-color: #10b981; }
    </style>
</head>
<body class="relative min-h-screen text-slate-800 selection:bg-emerald-500 selection:text-white pb-10">

    <!-- Blobs en tonos verdes/turquesas para diferenciar esta herramienta -->
    <div class="blob bg-emerald-300 w-[500px] h-[500px] top-[-100px] left-[-100px] opacity-40"></div>
    <div class="blob bg-teal-200 w-[400px] h-[400px] bottom-[100px] right-[-50px] opacity-50" style="animation-delay: -2s;"></div>
    <div class="blob bg-cyan-200 w-[300px] h-[300px] top-[40%] left-[50%] opacity-40" style="animation-delay: -4s;"></div>

    <header class="glass-panel sticky top-0 z-50 px-8 py-4 mb-8">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-emerald-500 to-teal-600 shadow-lg shadow-emerald-500/30 flex items-center justify-center">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10l-2 1m0 0l-2-1m2 1v2.5M20 7l-2 1m2-1l-2-1m2 1v2.5M14 4l-2-1-2 1M4 7l2-1M4 7l2 1M4 7v2.5M12 21l-2-1m2 1l2-1m-2 1v-2.5M6 18l-2-1v-2.5M18 18l2-1v-2.5"></path></svg>
                </div>
                Estudio Inteligente (IA)
            </h1>
            <a href="index.html" class="text-sm font-semibold text-emerald-600 hover:text-emerald-800 transition-colors">← Volver al Hub</a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto w-full px-6 space-y-6 relative z-10">
        
        <div class="glass-panel rounded-3xl p-8">
            <h2 class="text-lg font-bold text-slate-700 mb-5 border-b border-slate-200/60 pb-3">1. Cargar Imágenes y Configurar Sombra</h2>
            
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Columna 1: Imágenes y Fondo -->
                <div class="space-y-5">
                    <div class="relative group">
                        <div class="absolute -inset-0.5 bg-gradient-to-r from-emerald-400 to-teal-400 rounded-2xl blur opacity-20 transition duration-200"></div>
                        <div class="relative bg-white/60 border border-white/80 p-5 rounded-2xl backdrop-blur-sm">
                            <label class="block text-sm font-bold text-slate-700 mb-1">📸 Fotos Originales</label>
                            <p class="text-xs text-slate-500 mb-3 font-medium">Podés seleccionar varias fotos a la vez.</p>
                            <input type="file" id="file-images" accept="image/*" multiple class="block w-full text-sm text-slate-600 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-bold file:bg-emerald-100 file:text-emerald-700 hover:file:bg-emerald-200 cursor-pointer transition-colors"/>
                        </div>
                    </div>

                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                        <label class="text-xs font-bold text-slate-700 uppercase mb-2 block">Lienzo de Salida</label>
                        <select id="bg-color" class="custom-select">
                            <option value="white">Blanco (Ideal JPG Odoo)</option>
                            <option value="transparent">Transparente (PNG sin fondo)</option>
                        </select>
                    </div>
                </div>

                <!-- Columna 2 y 3: Controles de Sombra -->
                <div class="lg:col-span-2 bg-slate-50 p-6 rounded-2xl border border-slate-200">
                    <h3 class="text-sm font-bold text-emerald-800 mb-4 flex items-center gap-2">
                        <span>🌤️</span> Ajustes de Sombra Proyectada
                    </h3>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="text-xs font-bold text-slate-600 flex justify-between mb-2">
                                <span>Difuminado (Suavidad)</span>
                                <span id="val-blur" class="text-emerald-600">30px</span>
                            </label>
                            <input type="range" id="shadow-blur" min="0" max="100" value="30">
                            
                            <label class="text-xs font-bold text-slate-600 flex justify-between mt-4 mb-2">
                                <span>Opacidad (Oscuridad)</span>
                                <span id="val-opacity" class="text-emerald-600">40%</span>
                            </label>
                            <input type="range" id="shadow-opacity" min="0" max="100" value="40">
                        </div>

                        <div>
                            <label class="text-xs font-bold text-slate-600 flex justify-between mb-2">
                                <span>Desplazamiento Horizontal (↔)</span>
                                <span id="val-x" class="text-emerald-600">10px</span>
                            </label>
                            <input type="range" id="shadow-x" min="-100" max="100" value="10">
                            
                            <label class="text-xs font-bold text-slate-600 flex justify-between mt-4 mb-2">
                                <span>Desplazamiento Vertical (↕)</span>
                                <span id="val-y" class="text-emerald-600">15px</span>
                            </label>
                            <input type="range" id="shadow-y" min="-100" max="100" value="15">
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-8 flex flex-col sm:flex-row gap-4 items-center justify-between">
                <button id="btn-process" class="w-full sm:w-auto bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold py-3 px-8 rounded-xl shadow-lg shadow-emerald-500/30 transform transition-all duration-200 hover:-translate-y-0.5 text-sm uppercase tracking-wide">
                    ✨ Iniciar Recorte Inteligente
                </button>
                <p id="status-text" class="text-sm font-bold text-slate-500 hidden animate-pulse">
                    Cargando modelo de IA (Esto puede tardar un poco la primera vez)...
                </p>
            </div>
        </div>

        <div id="results-section" class="hidden space-y-6">
            <div class="glass-panel p-5 rounded-2xl flex flex-col md:flex-row items-center justify-between border-l-4 border-l-emerald-500">
                <div>
                    <h3 class="text-lg font-bold text-slate-800">Recortes Finalizados</h3>
                    <p class="text-sm text-slate-500 font-medium mt-1">Lienzos cuadrados perfectos, listos para subir.</p>
                </div>
                <button id="btn-dl-zip" class="mt-4 md:mt-0 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-bold py-2.5 px-6 rounded-xl shadow-lg shadow-indigo-500/30 flex items-center gap-2 transition-transform hover:-translate-y-0.5">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Descargar ZIP
                </button>
            </div>

            <div class="glass-panel rounded-3xl p-6">
                <div id="preview-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                    <!-- Las imágenes se inyectan acá por JS -->
                </div>
            </div>
        </div>
    </main>

    <script>
        // Actualizar los numeritos de los sliders en vivo
        ['shadow-blur', 'shadow-opacity', 'shadow-x', 'shadow-y'].forEach(id => {
            document.getElementById(id).addEventListener('input', (e) => {
                let suffix = id === 'shadow-opacity' ? '%' : 'px';
                document.getElementById(`val-${id.split('-')[1]}`).textContent = e.target.value + suffix;
            });
        });

        let processedImages = [];

        // Helper para achicar la foto si es gigantesca antes de pasarla a la IA
        function compressImageForAI(file, maxDim = 1500) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    if (img.width <= maxDim && img.height <= maxDim) {
                        resolve(file); // No necesita compresión
                        return;
                    }
                    const canvas = document.createElement('canvas');
                    let ratio = Math.min(maxDim / img.width, maxDim / img.height);
                    canvas.width = img.width * ratio;
                    canvas.height = img.height * ratio;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    canvas.toBlob((blob) => {
                        resolve(new File([blob], file.name, { type: 'image/jpeg' }));
                    }, 'image/jpeg', 0.9);
                };
                img.src = URL.createObjectURL(file);
            });
        }

        // Cargar el BLOB (imagen recortada por IA) y convertirla en una etiqueta Image() utilizable
        function blobToImage(blob) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.src = URL.createObjectURL(blob);
            });
        }

        document.getElementById('btn-process').addEventListener('click', async () => {
            const files = document.getElementById('file-images').files;
            if(files.length === 0) { alert("Seleccioná al menos una imagen."); return; }

            const statusText = document.getElementById('status-text');
            const previewGrid = document.getElementById('preview-grid');
            const resultsSection = document.getElementById('results-section');
            const btnProcess = document.getElementById('btn-process');

            const sBlur = parseInt(document.getElementById('shadow-blur').value);
            const sOpac = parseInt(document.getElementById('shadow-opacity').value) / 100;
            const sX = parseInt(document.getElementById('shadow-x').value);
            const sY = parseInt(document.getElementById('shadow-y').value);
            const bgColor = document.getElementById('bg-color').value;

            // Mostrar el área de proceso
            resultsSection.classList.remove('hidden');
            previewGrid.innerHTML = '';
            statusText.classList.remove('hidden');
            btnProcess.disabled = true;
            btnProcess.classList.add('opacity-50', 'cursor-not-allowed');
            processedImages = [];

            // Configuración de la librería de IA para descargar los modelos desde internet
            const imglyConfig = {
                publicPath: "https://unpkg.com/@imgly/background-removal@1.4.3/dist/"
            };

            for (let i = 0; i < files.length; i++) {
                let file = files[i];
                statusText.textContent = `Procesando IA: Foto ${i + 1} de ${files.length} (${file.name})...`;

                try {
                    // 1. Reducir tamaño por si es una foto de cámara de 6000px
                    let optimizedFile = await compressImageForAI(file);
                    
                    // 2. IA MAGIA: Saca el fondo y devuelve un BLOB transparente
                    let cutoutBlob = await imglyRemoveBackground(optimizedFile, imglyConfig);
                    let cutoutImg = await blobToImage(cutoutBlob);

                    // 3. Crear el lienzo de salida CUADRADO
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    // Hacemos el lienzo un 20% más grande que el objeto para darle aire
                    const maxDim = Math.max(cutoutImg.width, cutoutImg.height);
                    const canvasSize = maxDim * 1.2; 
                    canvas.width = canvasSize;
                    canvas.height = canvasSize;

                    // 4. Pintar fondo
                    if (bgColor === 'white') {
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                    } else {
                        ctx.clearRect(0, 0, canvas.width, canvas.height); // Transparente
                    }

                    // 5. Configurar SOMBRA INTELIGENTE
                    ctx.shadowColor = `rgba(0, 0, 0, ${sOpac})`;
                    ctx.shadowBlur = sBlur;
                    ctx.shadowOffsetX = sX;
                    ctx.shadowOffsetY = sY;

                    // 6. Dibujar la imagen recortada centrada
                    // Al dibujarla, HTML5 Canvas automáticamente le proyecta la sombra configurada arriba
                    const xPos = (canvasSize - cutoutImg.width) / 2;
                    const yPos = (canvasSize - cutoutImg.height) / 2;
                    ctx.drawImage(cutoutImg, xPos, yPos, cutoutImg.width, cutoutImg.height);

                    // Guardar resultado (JPEG para blanco, PNG si es transparente)
                    const outFormat = bgColor === 'white' ? 'image/jpeg' : 'image/png';
                    const outExt = bgColor === 'white' ? '.jpg' : '.png';
                    const nameNoExt = file.name.substring(0, file.name.lastIndexOf('.'));
                    const finalName = nameNoExt + "_recorte" + outExt;
                    const dataUrl = canvas.toDataURL(outFormat, 0.95);

                    processedImages.push({ name: finalName, dataUrl: dataUrl });

                    // Mostrar en grilla en vivo
                    previewGrid.innerHTML += `
                        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden group">
                            <div class="aspect-square flex items-center justify-center p-2" style="background: repeating-conic-gradient(#f1f5f9 0% 25%, transparent 0% 50%) 50% / 20px 20px;">
                                <img src="${dataUrl}" class="w-full h-full object-contain drop-shadow-sm" />
                            </div>
                            <div class="p-3 bg-white text-center">
                                <p class="text-[10px] font-bold text-slate-500 truncate">${finalName}</p>
                            </div>
                        </div>
                    `;

                } catch (error) {
                    console.error("Error procesando:", file.name, error);
                    alert("Hubo un error con la imagen " + file.name + ". Asegurate de tener conexión a internet estable.");
                }
            }

            statusText.textContent = `¡Proceso completado con éxito!`;
            statusText.classList.remove('animate-pulse');
            btnProcess.disabled = false;
            btnProcess.classList.remove('opacity-50', 'cursor-not-allowed');
        });

        // Descarga
        document.getElementById('btn-dl-zip').addEventListener('click', async () => {
            if (processedImages.length === 0) return;
            const zip = new JSZip();
            const folder = zip.folder("Imagenes_Recortadas");

            processedImages.forEach(img => {
                const base64Data = img.dataUrl.split(',')[1];
                folder.file(img.name, base64Data, {base64: true});
            });

            const content = await zip.generateAsync({type:"blob"});
            const link = document.createElement('a');
            link.href = URL.createObjectURL(content);
            link.download = "XFish_Recortes_IA.zip";
            link.click();
        });
    </script>
</body>
</html>
