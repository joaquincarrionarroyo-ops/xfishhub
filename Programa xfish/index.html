<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Herramientas X-Fish</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f0f4f8; }
        .glass-panel { background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: 0 8px 32px 0 rgba(14, 56, 114, 0.05); }
        .blob { position: absolute; filter: blur(90px); z-index: -1; border-radius: 50%; animation: float 10s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0px) scale(1); } 50% { transform: translateY(-20px) scale(1.05); } }
    </style>
</head>
<body class="relative min-h-screen flex items-center justify-center overflow-x-hidden selection:bg-blue-500 selection:text-white p-6 py-12">

    <div class="blob bg-blue-300 w-[500px] h-[500px] top-[-100px] left-[-100px] opacity-60"></div>
    <div class="blob bg-sky-200 w-[400px] h-[400px] bottom-[50px] right-[-50px] opacity-70" style="animation-delay: -2s;"></div>
    <div class="blob bg-amber-100 w-[300px] h-[300px] top-[20%] left-[60%] opacity-50" style="animation-delay: -4s;"></div>

    <!-- 🔐 PANTALLA DE LOGIN -->
    <div id="pantalla-login" class="relative z-10 w-full max-w-md mx-auto flex flex-col items-center">
        <div class="glass-panel rounded-3xl p-10 w-full flex flex-col items-center text-center shadow-2xl">
            <div class="w-16 h-16 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 mb-6">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </div>
            <h2 class="text-2xl font-extrabold text-slate-800 mb-2">Acceso Restringido</h2>
            <p class="text-slate-500 text-sm mb-8">Ingresa la clave de API para desbloquear el sistema X-Fish.</p>
            
            <input type="password" id="input-password" placeholder="••••••••••••••••" class="w-full bg-white/80 border border-slate-300 rounded-xl px-4 py-3 mb-4 text-center tracking-widest focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all">
            
            <button onclick="iniciarSesion()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition-all shadow-lg shadow-blue-500/30">
                Desbloquear Hub
            </button>
        </div>
    </div>

    <!-- 🛠️ MENÚ DE HERRAMIENTAS (Oculto al inicio) -->
    <div id="pantalla-hub" class="relative z-10 w-full max-w-6xl hidden">
        <div class="text-center mb-12 relative">
            <button onclick="cerrarSesion()" class="absolute right-0 top-0 text-sm text-red-500 hover:text-red-700 font-semibold bg-red-50 px-4 py-2 rounded-full transition-colors">
                Cerrar Sesión
            </button>
            <h1 class="text-4xl md:text-5xl font-extrabold text-slate-800 tracking-tight mb-3">Hub de Inventario</h1>
            <p class="text-lg text-slate-500 font-medium max-w-xl mx-auto">Selecciona la herramienta que deseas utilizar.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <a href="altas.html" class="glass-panel rounded-3xl p-8 flex flex-col group hover:-translate-y-2 hover:shadow-2xl transition-all"><h2 class="text-2xl font-bold text-slate-800 mb-2">Generador de Altas</h2></a>
            <a href="diferenciainventario.html" class="glass-panel rounded-3xl p-8 flex flex-col group hover:-translate-y-2 hover:shadow-2xl transition-all"><h2 class="text-2xl font-bold text-slate-800 mb-2">Diferencia General</h2></a>
            <a href="editor-imagenes.html" class="glass-panel rounded-3xl p-8 flex flex-col group hover:-translate-y-2 hover:shadow-2xl transition-all"><h2 class="text-2xl font-bold text-slate-800 mb-2">Estampador Dinámico</h2></a>
            <a href="alta-inventario.html" class="glass-panel rounded-3xl p-8 flex flex-col group hover:-translate-y-2 hover:shadow-2xl transition-all"><h2 class="text-2xl font-bold text-slate-800 mb-2">Alta de Inventario</h2></a>
            <a href="precios_nuevos.html" class="glass-panel rounded-3xl p-8 flex flex-col group hover:-translate-y-2 hover:shadow-2xl transition-all"><h2 class="text-2xl font-bold text-slate-800 mb-2">Actualizador Precios</h2></a>
            <a href="buscador.html" class="glass-panel rounded-3xl p-8 flex flex-col group hover:-translate-y-2 hover:shadow-2xl transition-all"><h2 class="text-2xl font-bold text-slate-800 mb-2">Buscador Visual</h2></a>
        </div>
    </div>

<script>
    // Comprobar si ya hay clave al cargar la página
    document.addEventListener('DOMContentLoaded', () => {
        if (sessionStorage.getItem('odoo_pwd')) {
            document.getElementById('pantalla-login').classList.add('hidden');
            document.getElementById('pantalla-hub').classList.remove('hidden');
        }
    });

    function iniciarSesion() {
        const pwd = document.getElementById('input-password').value;
        if (pwd) {
            sessionStorage.setItem('odoo_pwd', pwd); // Guarda en memoria volátil
            document.getElementById('pantalla-login').classList.add('hidden');
            document.getElementById('pantalla-hub').classList.remove('hidden');
        }
    }

    function cerrarSesion() {
        sessionStorage.removeItem('odoo_pwd');
        location.reload();
    }
</script>

</body>
</html>
