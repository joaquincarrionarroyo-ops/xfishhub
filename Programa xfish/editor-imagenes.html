<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estampador Masivo de Imágenes | X-Fish</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- JSZip para descargar todas las fotos juntas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f4f8; 
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 8px 32px 0 rgba(14, 56, 114, 0.05);
        }
        .blob { position: fixed; filter: blur(90px); z-index: -1; border-radius: 50%; animation: float 10s ease-in-out infinite; }
        @keyframes float { 0% { transform: translateY(0px) scale(1); } 50% { transform: translateY(-20px) scale(1.05); } 100% { transform: translateY(0px) scale(1); } }
        .custom-select, .custom-input {
            width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px;
            background-color: rgba(255, 255, 255, 0.8); outline: none; transition: all 0.2s; font-weight: 600; color: #334155;
        }
        .custom-select:focus, .custom-input:focus { border-color: #ec4899; box-shadow: 0 0 0 3px rgba(236,72,153,0.2); background-color: #fff; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.02); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="relative min-h-screen text-slate-800 selection:bg-pink-500 selection:text-white pb-10">

    <!-- Blobs Decorativos -->
    <div class="blob bg-pink-300 w-[500px] h-[500px] top-[-100px] left-[-100px] opacity-40"></div>
    <div class="blob bg-indigo-200 w-[400px] h-[400px] bottom-[100px] right-[-50px] opacity-50" style="animation-delay: -2s;"></div>
    <div class="blob bg-purple-200 w-[300px] h-[300px] top-[40%] left-[50%] opacity-40" style="animation-delay: -4s;"></div>

    <!-- Header -->
    <header class="glass-panel sticky top-0 z-50 px-8 py-4 mb-8">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-pink-500 to-rose-600 shadow-lg shadow-pink-500/30 flex items-center justify-center">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                </div>
                Estampador de Banners
            </h1>
            <a href="index.html" class="text-sm font-semibold text-pink-600 hover:text-pink-800 transition-colors">← Volver al Hub</a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto w-full px-6 space-y-6 relative z-10">
        
        <!-- Configuración de Archivos -->
        <div class="glass-panel rounded-3xl p-8">
            <h2 class="text-lg font-bold text-slate-700 mb-5 border-b border-slate-200/60 pb-3">1. Cargar Datos e Imágenes</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-6">
                <!-- Excel -->
                <div class="relative group">
                    <div class="absolute -inset-0.5 bg-gradient-to-r from-pink-400 to-rose-400 rounded-2xl blur opacity-20 group-hover:opacity-40 transition duration-200"></div>
                    <div class="relative bg-white/60 border border-white/80 p-5 rounded-2xl backdrop-blur-sm">
                        <label class="block text-sm font-bold text-slate-700 mb-1">📊 Excel con Textos</label>
                        <p class="text-xs text-slate-500 mb-3 font-medium">Archivo con los códigos, descripciones y precios.</p>
                        <input type="file" id="file-excel" accept=".xlsx, .xls, .csv" class="block w-full text-sm text-slate-600 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-bold file:bg-pink-100 file:text-pink-700 hover:file:bg-pink-200 cursor-pointer transition-colors"/>
                    </div>
                </div>

                <!-- Imágenes -->
                <div class="relative group">
                    <div class="absolute -inset-0.5 bg-gradient-to-r from-indigo-400 to-purple-400 rounded-2xl blur opacity-20 group-hover:opacity-40 transition duration-200"></div>
                    <div class="relative bg-white/60 border border-white/80 p-5 rounded-2xl backdrop-blur-sm">
                        <label class="block text-sm font-bold text-slate-700 mb-1">📸 Carpeta de Imágenes</label>
                        <p class="text-xs text-slate-500 mb-3 font-medium">El nombre del archivo (ej: COMM240.png) debe coincidir con el código.</p>
                        <input type="file" id="file-images" accept="image/*" multiple class="block w-full text-sm text-slate-600 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-bold file:bg-indigo-100 file:text-indigo-700 hover:file:bg-indigo-200 cursor-pointer transition-colors"/>
                    </div>
                </div>
            </div>

            <!-- Mapeo de Columnas (Oculto hasta subir Excel) -->
            <div id="mapping-section" class="hidden bg-pink-50/50 p-5 rounded-2xl border border-pink-100/50 mb-6">
                <h3 class="text-sm font-bold text-pink-800 mb-4">Configuración del Banner</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="text-xs font-semibold text-slate-600 mb-1 block">Vincular Código (Nombre Foto)</label>
                        <select id="col-cod" class="custom-select"></select>
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-slate-600 mb-1 block">Texto ARRIBA (Ej: Nombre)</label>
                        <select id="col-texto-arriba" class="custom-select"></select>
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-slate-600 mb-1 block">Texto ABAJO (Ej: Código/Precio)</label>
                        <select id="col-texto-abajo" class="custom-select"></select>
                    </div>
                </div>
            </div>

            <button id="btn-process" class="w-full sm:w-auto bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg shadow-pink-500/30 transform transition-all duration-200 hover:-translate-y-0.5 text-sm uppercase tracking-wide">
                🎨 Procesar Imágenes
            </button>
        </div>

        <!-- Dashboard Resultados -->
        <div id="results-section" class="hidden space-y-6">
            
            <div class="glass-panel p-5 rounded-2xl flex flex-col md:flex-row items-center justify-between border-l-4 border-l-pink-500">
                <div>
                    <h3 class="text-lg font-bold text-slate-800" id="results-text">¡Imágenes procesadas!</h3>
                    <p class="text-sm text-slate-500 font-medium mt-1" id="results-subtext">Diseño generado correctamente.</p>
                </div>
                <button id="btn-dl-zip" class="mt-4 md:mt-0 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-bold py-2.5 px-6 rounded-xl shadow-lg shadow-indigo-500/30 flex items-center gap-2 transition-transform hover:-translate-y-0.5">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Descargar todas (.ZIP)
                </button>
            </div>

            <!-- Grilla de Previsualización -->
            <div class="glass-panel rounded-3xl p-6">
                <div id="preview-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                    <!-- Las imágenes se inyectan acá por JS -->
                </div>
            </div>
        </div>
    </main>

    <script>
        let excelData = [];
        let excelHeaders = [];
        let imageFiles = [];
        let processedImages = []; 

        const mappingSection = document.getElementById('mapping-section');
        const resultsSection = document.getElementById('results-section');
        const previewGrid = document.getElementById('preview-grid');

        // Leer Excel
        document.getElementById('file-excel').addEventListener('change', (e) => {
            if(e.target.files.length) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    excelData = XLSX.utils.sheet_to_json(firstSheet, {defval: ""});
                    excelHeaders = XLSX.utils.sheet_to_json(firstSheet, {header: 1})[0] || [];
                    
                    populateSelect('col-cod', excelHeaders);
                    populateSelect('col-texto-arriba', excelHeaders);
                    populateSelect('col-texto-abajo', excelHeaders);
                    mappingSection.classList.remove('hidden');
                };
                reader.readAsArrayBuffer(e.target.files[0]);
            }
        });

        // Cargar Imágenes a la memoria
        document.getElementById('file-images').addEventListener('change', (e) => {
            imageFiles = Array.from(e.target.files);
        });

        function populateSelect(id, options) {
            const select = document.getElementById(id);
            select.innerHTML = "<option value=''>-- Vacío / No imprimir --</option>";
            options.forEach(opt => {
                if(opt && String(opt).trim() !== "") {
                    const el = document.createElement("option");
                    el.value = String(opt); el.textContent = String(opt); select.appendChild(el);
                }
            });
        }

        // Función Core: Dibuja el fondo, foto al centro y textos (Estilo Imagen Referencia)
        function processSingleImage(file, textTop, textBottom) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');

                    const width = img.width;
                    const height = img.height;
                    
                    // Calculamos un margen proporcional (15% de la foto para arriba y 15% para abajo)
                    const marginHeight = Math.max(height * 0.15, 100); 
                    
                    // Tamaño total del lienzo
                    canvas.width = width;
                    canvas.height = height + (marginHeight * 2);

                    // 1. Fondo blanco limpio
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    // 2. Dibujar foto original en el medio
                    ctx.drawImage(img, 0, marginHeight, width, height);

                    // 3. Configuración del Texto (Berlin Sans FB con fallbacks de seguridad)
                    ctx.fillStyle = '#000000'; // Negro sólido
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    
                    const printText = (text, yPos) => {
                        if (!text || String(text).trim() === "") return; // Si no hay texto, no imprime nada
                        
                        let fontSize = marginHeight * 0.45;
                        ctx.font = `bold ${fontSize}px "Berlin Sans FB", "Trebuchet MS", sans-serif`;
                        
                        // Si el texto es más ancho que la imagen, achicar letra
                        let textWidth = ctx.measureText(text).width;
                        const maxWidth = width * 0.9; // Margen de respiro
                        if (textWidth > maxWidth) {
                            fontSize = fontSize * (maxWidth / textWidth);
                            ctx.font = `bold ${fontSize}px "Berlin Sans FB", "Trebuchet MS", sans-serif`;
                        }
                        ctx.fillText(text, width / 2, yPos);
                    };

                    // Imprimir Arriba (Centro del margen superior)
                    printText(textTop, marginHeight / 2);
                    
                    // Imprimir Abajo (Centro del margen inferior)
                    printText(textBottom, marginHeight + height + (marginHeight / 2));

                    resolve({
                        name: file.name,
                        dataUrl: canvas.toDataURL('image/jpeg', 0.98)
                    });
                };
                img.src = URL.createObjectURL(file);
            });
        }

        // Botón procesar
        document.getElementById('btn-process').addEventListener('click', async () => {
            const colCod = document.getElementById('col-cod').value;
            const colTop = document.getElementById('col-texto-arriba').value;
            const colBottom = document.getElementById('col-texto-abajo').value;

            if(!colCod) {
                alert("Debes seleccionar obligatoriamente la Columna del Código para buscar la foto."); return;
            }
            if(imageFiles.length === 0) {
                alert("Seleccioná al menos una imagen para procesar."); return;
            }

            // Crear diccionario limpio
            const dictExcel = {};
            excelData.forEach(row => {
                let cod = String(row[colCod] || "").trim().toUpperCase();
                let txtTop = colTop ? String(row[colTop] || "").trim() : "";
                let txtBot = colBottom ? String(row[colBottom] || "").trim() : "";
                
                // Agregamos un prefijo de COD: si el campo de abajo es el código explícito como pediste (opcional)
                // Si preferís que ponga solo lo que dice el excel, borrá la lógica de agregar "COD: " en la fila de abajo.
                if (txtBot && colBottom === colCod && !txtBot.includes("COD")) {
                     txtBot = "COD: " + txtBot;
                }

                if(cod) dictExcel[cod] = { top: txtTop, bottom: txtBot };
            });

            processedImages = [];
            previewGrid.innerHTML = '<p class="col-span-full text-center text-slate-500 font-bold animate-pulse">Procesando imágenes, por favor esperá...</p>';
            resultsSection.classList.remove('hidden');

            let matchCount = 0;

            for (let file of imageFiles) {
                // FILTRO ROBUSTO: Saca la extensión y borra espacios ocultos del nombre del archivo
                let lastDotIndex = file.name.lastIndexOf('.');
                let fileNameWithoutExt = lastDotIndex !== -1 ? file.name.substring(0, lastDotIndex) : file.name;
                fileNameWithoutExt = String(fileNameWithoutExt).trim().toUpperCase();
                
                if (dictExcel[fileNameWithoutExt]) {
                    let data = dictExcel[fileNameWithoutExt];
                    let result = await processSingleImage(file, data.top, data.bottom);
                    processedImages.push(result);
                    matchCount++;
                }
            }

            document.getElementById('results-subtext').textContent = `Se estamparon ${matchCount} imágenes con éxito (de ${imageFiles.length} subidas).`;

            previewGrid.innerHTML = '';
            processedImages.forEach(imgData => {
                previewGrid.innerHTML += `
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden group">
                        <div class="aspect-square bg-slate-100 flex items-center justify-center overflow-hidden">
                            <img src="${imgData.dataUrl}" class="w-full h-full object-contain group-hover:scale-105 transition-transform duration-300" />
                        </div>
                        <div class="p-3 bg-white">
                            <p class="text-xs font-bold text-slate-700 truncate">${imgData.name}</p>
                        </div>
                    </div>
                `;
            });

            if(matchCount === 0) {
                previewGrid.innerHTML = '<p class="col-span-full text-center text-red-500 font-bold">No se encontró coincidencia entre los nombres de las fotos y el Excel. Verificá que se llamen igual (Ej: NK-1003LL.png).</p>';
            }
        });

        document.getElementById('btn-dl-zip').addEventListener('click', async () => {
            if (processedImages.length === 0) return;
            
            const zip = new JSZip();
            const folder = zip.folder("Imagenes_Banners");

            processedImages.forEach(img => {
                const base64Data = img.dataUrl.split(',')[1];
                folder.file(img.name, base64Data, {base64: true});
            });

            const content = await zip.generateAsync({type:"blob"});
            
            const link = document.createElement('a');
            link.href = URL.createObjectURL(content);
            link.download = "Banners_XFish.zip";
            link.click();
        });
    </script>
</body>
</html>
